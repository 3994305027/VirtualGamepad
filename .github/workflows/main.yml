name: Build APK

# 触发时机：
#   push 到 main/master      → 编译并上传 APK 压缩包
#   push tag（v* 开头）      → 额外自动建一个 Release
#   pull request             → 只编译，验证能不能过
#   手动（Actions 页面点 Run）→ 随时可跑
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 时要建 Release，需要写权限

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新版 sdkmanager 必须跑在 JDK 17（class 61），Gradle 6.7.1 又不能跑在
      # JDK 17 上。所以装两个：17 装 SDK，11 编 Gradle。顺序不能反。
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDKROOT" ] || SDKROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$SDKROOT"; export ANDROID_SDK_ROOT="$SDKROOT"
          echo "使用 SDK 根目录: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-33" ] \
             && [ -d "$ANDROID_HOME/build-tools/33.0.1" ]; then
            echo "已存在，跳过安装"; exit 0
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F'"' '/version/{print $2}' \
                       | awk -F'.' '{print ($1=="1")?$2:$1}')
          echo "java 主版本: ${JAVA_MAJOR:-未知}"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ] 2>/dev/null; then
            for j in /usr/lib/jvm/*17* /usr/lib/jvm/*21*; do
              if [ -x "$j/bin/java" ]; then
                export JAVA_HOME="$j"; export PATH="$j/bin:$PATH"
                echo "改用 $JAVA_HOME"; break
              fi
            done
          fi
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            $(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -r | head -3) \
            "$ANDROID_HOME/tools/bin/sdkmanager" ; do
            [ -n "$p" ] && [ -x "$p" ] && { SDKMANAGER="$p"; break; }
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "自行下载 commandlinetools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL --retry 3 -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          printf 'y\ny\ny\ny\ny\n' \
            | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-33" "build-tools;33.0.1" "platform-tools" \
            || "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
                 "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          ls -d "$ANDROID_HOME/platforms/android-33" "$ANDROID_HOME/build-tools/33.0.1" 2>&1 || true

      - name: Set up JDK 11 (for Gradle 6.7.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 【核心：不再假定 settings.gradle 一定对】
      # 症状：Task 'assembleDebug' not found in root project 'VirtualGamepad'
      # 含义：Gradle 只加载了根工程，:app 模块根本没进构建 ——
      #   可能 settings.gradle 缺失 / 不在工作目录 / 内容是空的 /
      #   带 BOM / 只有 CRLF 没内容 / include 的不是 ':app'。
      # 这里逐字节查（cat -A 能看出 BOM 的 M-oM-;M-? 和换行的 ^M$），
      # 查完不合格就直接重写一份，不靠仓库里那份。
      - name: Locate and normalize project root
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"
          echo "===== 仓库根一览 ====="
          ls -la "$WS" | head -40
          echo "===== 全仓 find（.gradle/.git 除外，深度 6）====="
          find "$WS" -maxdepth 6 -not -path '*/.git/*' -not -path '*/.gradle/*' \
            \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' \) \
            -print 2>/dev/null | head -40
          echo "===== 所有叫 app 的目录 ====="
          find "$WS" -maxdepth 6 -type d -name app -not -path '*/.git/*' -print 2>/dev/null | head -10

          # ① 找工程根：优先「根上有 settings.gradle + app」，
          #    否则找「有 app 目录」的最浅一层
          PROJ=""
          if [ -d "$WS/app" ]; then PROJ="$WS"; fi
          if [ -z "$PROJ" ]; then
            PROJ=$(find "$WS" -maxdepth 6 -type d -name app -not -path '*/.git/*' \
                   -printf '%d %p\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)
            [ -n "$PROJ" ] && PROJ=$(dirname "$PROJ")
          fi
          [ -n "$PROJ" ] || { echo "::error::找不到 app 目录"; find "$WS" -maxdepth 3 | head -60; exit 1; }
          echo "工程根目录: $PROJ"
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"

          # ② 逐字节体检 settings.gradle
          echo "===== settings.gradle 体检 ====="
          SG="$PROJ/settings.gradle"
          if [ -f "$SG" ]; then
            echo "文件大小: $(wc -c < "$SG") 字节"
            echo "--- cat -A（显 BOM / 换行）---"
            cat -A "$SG" | head -20
            echo "--- 是否含 include ---"
            grep -c "include" "$SG" || echo "0 处 include"
          else
            echo "settings.gradle 不存在"
          fi

          # ③ 不合格就重写：没文件 / 体积 < 5 字节 / 不含 include ':app'
          NEED=0
          if [ ! -f "$SG" ]; then NEED=1
          elif [ "$(wc -c < "$SG")" -lt 5 ]; then NEED=1
          elif ! grep -q "include" "$SG"; then NEED=1
          fi
          if [ "$NEED" = "1" ]; then
            echo "::warning::settings.gradle 不合格，自动重写"
            # 去掉可能的 BOM，用 printf 写纯 ASCII，避免 Windows 编辑器再引入 BOM
            printf "include ':app'\n" > "$SG"
            chmod 644 "$SG"
          fi
          echo "--- 最终 settings.gradle（cat -A）---"
          cat -A "$SG"

          # ④ app/build.gradle 必须在，且要认得出是 Android 应用模块
          echo "===== app/build.gradle 体检 ====="
          if [ ! -f "$PROJ/app/build.gradle" ]; then
            echo "::error::app/build.gradle 不存在"
            ls -la "$PROJ/app" | head -30
            exit 1
          fi
          head -5 "$PROJ/app/build.gradle"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Gradle wrapper files
        run: |
          set -e
          cd "$PROJECT_DIR"
          test -f ./gradlew || { echo "::error::gradlew 不存在"; ls -la . | head -30; exit 1; }
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar 不存在"
          else
            unzip -l gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -i GradleWrapperMain \
              || echo "::warning::jar 里没有 GradleWrapperMain"
            grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x ./gradlew

      # 允许失败：只为排障。正常应看到 Root project + Project ':app'
      - name: Gradle projects sanity check
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          ./gradlew projects 2>&1 | tee "$GITHUB_WORKSPACE/gradle-projects.log"
          echo "退出码: ${PIPESTATUS[0]}"
          echo "--- 有没有 :app ---"
          grep -n "':app'" "$GITHUB_WORKSPACE/gradle-projects.log" || echo "未出现 :app"

      # 显式指定 :app，模块没进去会立刻报得更清楚
      - name: Build Debug APK
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-debug.log"

      - name: Build Release APK
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-release.log"

      - name: Collect APKs
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p apks/debug apks/release
          cp -v "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk   apks/debug/   2>&1 || true
          cp -v "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk apks/release/ 2>&1 || true
          find apks -type f -name '*.apk' -print

      - name: Dump failure logs
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE" 2>/dev/null || true
          echo "===== gradle-projects.log ====="
          head -n 50 gradle-projects.log 2>/dev/null || echo "(无)"
          echo "===== gradle-debug.log 末 200 行 ====="
          tail -n 200 gradle-debug.log 2>/dev/null || echo "(无)"
          echo "===== daemon 日志 ====="
          for f in "$HOME"/.gradle/daemon/*/daemon-*.log; do
            [ -f "$f" ] || continue; echo "--- $f ---"; tail -n 60 "$f"
          done
          echo "===== 错误行汇总 ====="
          grep -n -i -E "error:|FAILED|What went wrong|Caused by" \
            gradle-debug.log gradle-release.log gradle-projects.log 2>/dev/null | head -60 \
            || echo "(未匹配到)"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle-debug.log
            gradle-release.log
            gradle-projects.log
          if-no-files-found: ignore

      # —— 可选：正式签名 ——
      # 不配 secrets 就整段跳过。
      # Settings → Secrets 加四个：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 【为什么不在 if: 里判断 secrets】step 的 if: 读不到 secrets 上下文，
      # 写了会 Invalid workflow file，整个工作流跑不起来。所以判断放 shell。
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置签名 secrets，跳过（release 为 unsigned，仅留档）"; exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          UNSIGNED=$(ls apks/release/app-release-unsigned.apk 2>/dev/null || true)
          [ -n "$UNSIGNED" ] || { echo "::error::找不到 unsigned apk"; exit 0; }
          BT="$ANDROID_HOME/build-tools/33.0.1"
          [ -d "$BT" ] || BT="$ANDROID_SDK_ROOT/build-tools/33.0.1"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" apks/release/app-release-signed.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apks/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apks/release/*.apk
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            apks/debug/*.apk
            apks/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
