name: Build APK

# 触发时机：
#   push 到 main/master      → 编译并上传 APK
#   push tag（v* 开头）      → 额外自动建一个 Release
#   pull request             → 只编译，验证能不能过
#   手动（Actions 页面点 Run）→ 随时可跑
#
# 【排障约定】整个 job 的日志很容易被 GitHub 截断（上版就是被 --stacktrace
# 撑爆的）。所以关键结论一律用 ::error:: / ::warning:: 推到页面顶部的
# Annotations 区 —— 不用展开任何步骤就能看到原因。多行用 %0A 连接。
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新版 sdkmanager 必须 JDK 17（class 61），Gradle 6.7.1 又不能跑在
      # JDK 17 上。所以装两个：17 装 SDK，11 编 Gradle。顺序不能反。
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDKROOT" ] || SDKROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$SDKROOT"; export ANDROID_SDK_ROOT="$SDKROOT"
          echo "SDK 根目录: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-33" ] \
             && [ -d "$ANDROID_HOME/build-tools/33.0.1" ]; then
            echo "SDK 已齐，跳过安装"; exit 0
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F'"' '/version/{print $2}' \
                       | awk -F'.' '{print ($1=="1")?$2:$1}')
          echo "java 主版本: ${JAVA_MAJOR:-未知}"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ] 2>/dev/null; then
            for j in /usr/lib/jvm/*17* /usr/lib/jvm/*21*; do
              if [ -x "$j/bin/java" ]; then
                export JAVA_HOME="$j"; export PATH="$j/bin:$PATH"
                echo "改用 $JAVA_HOME"; break
              fi
            done
          fi
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            $(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -r | head -3) \
            "$ANDROID_HOME/tools/bin/sdkmanager" ; do
            [ -n "$p" ] && [ -x "$p" ] && { SDKMANAGER="$p"; break; }
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "自行下载 commandlinetools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL --retry 3 -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          printf 'y\ny\ny\ny\ny\n' \
            | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-33" "build-tools;33.0.1" "platform-tools" \
            || "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
                 "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          ls -d "$ANDROID_HOME/platforms/android-33" "$ANDROID_HOME/build-tools/33.0.1" 2>&1 || true

      - name: Set up JDK 11 (for Gradle 6.7.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 【核心自愈】症状：Task 'assembleDebug' not found in root project 'xxx'
      # 含义：Gradle 只加载了根工程，:app 没进构建。可能原因：
      #   settings.gradle 缺失 / 不在工作目录 / 0 字节 / 带 BOM /
      #   不含 include / include 的不是 ':app' /
      #   app/build.gradle 缺失或没 apply com.android.application（没这个插件
      #   就没有 assembleDebug 任务，报错长得一模一样）
      # 这里逐项体检，不合格当场重写，并把结论写进 DIAG 供最后汇总。
      - name: Locate and normalize project root
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"
          DIAG="$GITHUB_WORKSPACE/diag.txt"
          : > "$DIAG"

          echo "===== 仓库根 =====" | tee -a "$DIAG"
          ls -A "$WS" | head -30 | tee -a "$DIAG"

          echo "===== 全仓 find gradle 文件（深度 6）=====" | tee -a "$DIAG"
          find "$WS" -maxdepth 6 -not -path '*/.git/*' -not -path '*/.gradle/*' \
            \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' \) \
            -print 2>/dev/null | head -20 | tee -a "$DIAG"

          echo "===== app 目录 =====" | tee -a "$DIAG"
          APPS=$(find "$WS" -maxdepth 6 -type d -name app -not -path '*/.git/*' \
                 -printf '%d %p\n' 2>/dev/null | sort -n | head -5)
          echo "${APPS:-(无)}" | tee -a "$DIAG"

          # ① 定位工程根：优先根上有 app，否则取最浅的 app 的父目录
          PROJ=""
          if [ -d "$WS/app" ]; then PROJ="$WS"; fi
          if [ -z "$PROJ" ]; then
            D=$(echo "$APPS" | head -1 | cut -d' ' -f2-)
            [ -n "$D" ] && PROJ=$(dirname "$D")
          fi
          if [ -z "$PROJ" ]; then
            echo "::error::仓库里找不到 app 目录%0A$(echo "$APPS" | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"
          echo "工程根目录: $PROJ" | tee -a "$DIAG"

          # ② settings.gradle 逐字节体检（cat -A 能看出 BOM 的 M-oM-;M-? 与 ^M$）
          SG="$PROJ/settings.gradle"
          echo "===== settings.gradle 体检 =====" | tee -a "$DIAG"
          if [ -f "$SG" ]; then
            echo "大小: $(wc -c < "$SG") 字节" | tee -a "$DIAG"
            echo "cat -A: $(cat -A "$SG" | head -5 | tr '\n' '|')" | tee -a "$DIAG"
            echo "include 数: $(grep -c include "$SG" || true)" | tee -a "$DIAG"
          else
            echo "settings.gradle 不存在" | tee -a "$DIAG"
          fi

          # ③ 不合格就重写（printf 写，避免 Windows 编辑器再引入 BOM）
          NEED=0
          if [ ! -f "$SG" ]; then NEED=1
          elif [ "$(wc -c < "$SG")" -lt 5 ]; then NEED=1
          elif ! grep -q "include" "$SG"; then NEED=1
          fi
          if [ "$NEED" = "1" ]; then
            echo "::warning::settings.gradle 不合格，已自动重写为 include ':app'"
            printf "include ':app'\n" > "$SG"
            chmod 644 "$SG"
            echo "重写后: $(cat -A "$SG" | tr '\n' '|')" | tee -a "$DIAG"
          fi

          # ④ app/build.gradle 必须在，且必须有 Android 应用插件
          echo "===== app/build.gradle 体检 =====" | tee -a "$DIAG"
          BG="$PROJ/app/build.gradle"
          if [ ! -f "$BG" ]; then
            echo "::error::app/build.gradle 不存在"
            ls -A "$PROJ/app" | head -20 | tee -a "$DIAG"
            exit 1
          fi
          echo "大小: $(wc -c < "$BG") 字节" | tee -a "$DIAG"
          head -8 "$BG" | tee -a "$DIAG"
          if ! grep -q "com.android.application" "$BG"; then
            echo "::error::app/build.gradle 里没有 com.android.application —— 没有这个插件就没有 assembleDebug 任务"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Gradle wrapper files
        run: |
          set -e
          cd "$PROJECT_DIR"
          test -f ./gradlew || { echo "::error::gradlew 不存在"; exit 1; }
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar 不存在 —— 没有它 Gradle 起不来"
          else
            unzip -l gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -i GradleWrapperMain \
              >/dev/null || echo "::error::jar 里没有 GradleWrapperMain（jar 损坏）"
            grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x ./gradlew

      # 允许失败，只为排障。正常输出应含 Root project + Project ':app'
      - name: Gradle projects sanity check
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          ./gradlew projects > "$GITHUB_WORKSPACE/gradle-projects.log" 2>&1 \
            || echo "gradlew projects 退出码非零"
          grep -E "Root project|Project '|FAILURE|What went wrong" \
            "$GITHUB_WORKSPACE/gradle-projects.log" | head -10
          grep -q "':app'" "$GITHUB_WORKSPACE/gradle-projects.log" \
            && echo "检测到 :app 模块" \
            || echo "::error::gradle projects 里没有 :app —— settings.gradle 仍未生效"

      # 不用 --stacktrace：它会打出几百行堆栈，把整个 job 日志撑到被 GitHub 截断
      - name: Build Debug APK
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-debug.log"

      - name: Build Release APK
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-release.log"

      - name: Collect APKs
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p apks/debug apks/release
          cp -v "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk   apks/debug/   2>&1 || true
          cp -v "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk apks/release/ 2>&1 || true
          find apks -type f -name '*.apk' -print

      # 【关键】把结论推到页面顶部 Annotations，不用展开任何巨型日志
      - name: Summarize failure
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "===== settings.gradle ====="
            cat "$PROJECT_DIR/settings.gradle" 2>/dev/null || echo "(无)"
            echo "===== app 目录前 20 项 ====="
            ls -A "$PROJECT_DIR/app" 2>/dev/null | head -20
            echo "===== app/build.gradle 前 12 行 ====="
            head -12 "$PROJECT_DIR/app/build.gradle" 2>/dev/null || echo "(无)"
            echo "===== gradle projects 关键行 ====="
            grep -E "Root project|Project '|What went wrong" gradle-projects.log 2>/dev/null | head -10
            echo "===== gradle-debug.log 末 25 行 ====="
            tail -n 25 gradle-debug.log 2>/dev/null || echo "(无)"
          } > summary.txt 2>&1
          # 多行转成 %0A，塞进 annotation（页面顶部直接可见）
          echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' summary.txt)"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            summary.txt
            diag.txt
            gradle-debug.log
            gradle-release.log
            gradle-projects.log
          if-no-files-found: ignore

      # —— 可选：正式签名 ——
      # 【为什么不在 if: 里判断 secrets】step 的 if: 读不到 secrets 上下文，
      # 写了会 Invalid workflow file，整个工作流跑不起来。所以判断放 shell。
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置签名 secrets，跳过（release 为 unsigned，仅留档）"; exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          UNSIGNED=$(ls apks/release/app-release-unsigned.apk 2>/dev/null || true)
          [ -n "$UNSIGNED" ] || { echo "::error::找不到 unsigned apk"; exit 0; }
          BT="$ANDROID_HOME/build-tools/33.0.1"
          [ -d "$BT" ] || BT="$ANDROID_SDK_ROOT/build-tools/33.0.1"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" apks/release/app-release-signed.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apks/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apks/release/*.apk
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            apks/debug/*.apk
            apks/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
